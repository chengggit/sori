name: Desktop builds
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to package
        type: choice
        default: all
        options: [all, ubuntu-24.04, windows-2022, macos-15]
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true
jobs:
  changes:
    name: Detect build changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        name: Classify changed files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          code=true
          # Tags and manual runs always build. Unknown bases also build.
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch && "$GITHUB_REF" != refs/tags/* ]] \
              && [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] \
              && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"
            code=false
            while IFS= read -r -d '' path; do
              if [[ "$path" != */* && "$path" == *.md ]]; then continue; fi
              case "$path" in
                docs/*|.github/releases/*.md|tests/qml/README.md) ;;
                *) code=true; break ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
  build:
    needs: changes
    if: ${{ !cancelled() }}
    name: ${{ matrix.os == 'ubuntu-24.04' && 'Ubuntu 24.04 LTS x86_64' || matrix.os == 'windows-2022' && 'Windows x86_64' || 'macOS arm64' }} (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        # Main primes the same check cache that future PRs restore. Release
        # packages have their own optimized cache and run only when requested.
        mode: ${{ fromJSON((github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '["package"]' || '["check"]') }}
        os: ${{ fromJSON((!inputs.platform || inputs.platform == 'all') && '["ubuntu-24.04", "windows-2022", "macos-15"]' || format('["{0}"]', inputs.platform)) }}
    runs-on: ${{ needs.changes.outputs.code == 'true' && matrix.os || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      CI_BUILD_TYPE: Release
      # Keep the release Qt/CRT ABI on Windows. Checks skip expensive Rust
      # optimization; packaging uses the normal optimized profile.
      CARGO_PROFILE_RELEASE_OPT_LEVEL: ${{ matrix.mode == 'check' && '0' || '3' }}
      CI_BUNDLE_HELPER: ${{ matrix.mode == 'package' && 'ON' || 'OFF' }}
    steps:
      - name: Verify change detection
        shell: bash
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: |
          [[ "$CHANGE_RESULT" == success && ( "$CODE_CHANGED" == true || "$CODE_CHANGED" == false ) ]]
      - name: Documentation-only change
        if: needs.changes.outputs.code != 'true'
        run: echo 'Documentation-only change; build and tests skipped.'
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code == 'true'
        with:
          fetch-depth: 0
      - name: Check release notes
        if: needs.changes.outputs.code == 'true' && (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes=".github/releases/$RELEASE_TAG.md"
          if [[ ! -s "$notes" ]]; then
            echo "Missing release notes: $notes. Commit them before tagging." >&2
            exit 1
          fi
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.code == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'scripts/requirements-youtube*.txt'
      - name: Linux dependencies
        if: needs.changes.outputs.code == 'true' && (runner.os == 'Linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config libmpv-dev ffmpeg appstream libegl1-mesa-dev libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 libxcb-xinerama0 libnss3 libasound2t64 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxshmfence1
      - name: macOS dependencies
        if: needs.changes.outputs.code == 'true' && (runner.os == 'macOS')
        run: |
          brew install mpv ffmpeg pkg-config ninja libarchive
          echo "MACOSX_DEPLOYMENT_TARGET=15.0" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-Lnative=$(brew --prefix mpv)/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix mpv)/lib/pkgconfig:$(brew --prefix libarchive)/lib/pkgconfig" >> "$GITHUB_ENV"
      - uses: ilammy/msvc-dev-cmd@v1
        if: needs.changes.outputs.code == 'true' && (runner.os == 'Windows')
      - name: Windows mpv development files
        if: needs.changes.outputs.code == 'true' && (runner.os == 'Windows')
        shell: pwsh
        run: ./scripts/ci/windows-mpv.ps1
      - name: Validate Windows packaging scripts
        if: needs.changes.outputs.code == 'true' && (runner.os == 'Windows')
        shell: pwsh
        run: |
          Get-ChildItem scripts/ci/*.ps1 | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - name: Windows media tools
        if: needs.changes.outputs.code == 'true' && (runner.os == 'Windows')
        shell: pwsh
        run: choco install ffmpeg --no-progress -y
      - uses: jurplel/install-qt-action@v4
        if: needs.changes.outputs.code == 'true'
        with:
          version: '6.10.2'
          arch: ${{ runner.os == 'Linux' && 'linux_gcc_64' || runner.os == 'Windows' && 'win64_msvc2022_64' || 'clang_64' }}
          modules: 'qtpdf qtwebengine qtwebchannel qtpositioning qtshadertools qtserialport'
          cache: true
      - name: Rust toolchain
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [[ "$RUNNER_OS" == Windows ]]; then
            qmake="$(cygpath -m "$QT_ROOT_DIR/bin/qmake.exe")"
          else
            qmake="$QT_ROOT_DIR/bin/qmake"
          fi
          echo "QMAKE=$qmake" >> "$GITHUB_ENV"
          if [[ "$RUNNER_OS" == macOS ]]; then
            echo "RUSTFLAGS=$RUSTFLAGS -C link-arg=-Wl,-rpath,$QT_ROOT_DIR/lib" >> "$GITHUB_ENV"
          fi
      - name: Cache compiled Rust dependencies
        if: needs.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'core -> ../build/cargo'
          key: '${{ runner.os }}-${{ runner.arch }}-qt6.10.2-${{ env.CI_BUILD_TYPE }}-opt${{ env.CARGO_PROFILE_RELEASE_OPT_LEVEL }}'
          cache-on-failure: true
          env-vars: 'QMAKE QT_ROOT_DIR MACOSX_DEPLOYMENT_TARGET'
      - name: Cache Kiwi resources
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: build/deps/kiwi
          key: kiwi-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-kiwi.cmake') }}
      - name: Python test environment
        if: needs.changes.outputs.code == 'true' && (matrix.mode == 'check')
        shell: bash
        run: |
          python -m venv .venv-youtube
          if [[ "$RUNNER_OS" == Windows ]]; then python_path=.venv-youtube/Scripts/python.exe; else python_path=.venv-youtube/bin/python; fi
          "$python_path" -m pip install -r scripts/requirements-youtube.txt
      - name: Configure
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: |
          extra=()
          if [[ "$RUNNER_OS" == Windows ]]; then extra+=("-DMPV_ROOT=$MPV_ROOT"); fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE="$CI_BUILD_TYPE" -DSORI_REQUIRE_WEBENGINE=ON -DSORI_BUNDLE_TRANSCRIPT_HELPER="$CI_BUNDLE_HELPER" -DSORI_TEST_NATIVE_KIWI=ON "${extra[@]}"
      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: cmake --build build --parallel 2
      - name: Windows test runtime
        if: needs.changes.outputs.code == 'true' && (runner.os == 'Windows')
        shell: pwsh
        run: |
          Copy-Item "$env:MPV_ROOT/bin/*.dll" build/ -Force
          dumpbin /dependents build/sori-bridge-test.exe
      - name: Prepare native test fixtures
        if: needs.changes.outputs.code == 'true'
        run: cmake -E copy_directory build/deps/kiwi resources/kiwi
      - name: Tests
        if: needs.changes.outputs.code == 'true'
        run: ctest --test-dir build --verbose --timeout 600
      - name: Package
        if: needs.changes.outputs.code == 'true' && (matrix.mode == 'package')
        run: cmake --build build --target package
      - name: Windows install and uninstall check
        if: needs.changes.outputs.code == 'true' && (matrix.mode == 'package' && runner.os == 'Windows')
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/ci/test-windows-installer.ps1
      - name: Wayland OpenGL startup check
        if: needs.changes.outputs.code == 'true' && matrix.mode == 'package' && runner.os == 'Linux'
        timeout-minutes: 5
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get install -y --no-install-recommends weston libgl1-mesa-dri
          runtime_dir="$(mktemp -d "$RUNNER_TEMP/sori-wayland.XXXXXX")"
          export XDG_RUNTIME_DIR="$runtime_dir"
          log="$PWD/build/Testing/Temporary/wayland-compositor.log"
          weston --backend=headless --renderer=gl --socket=sori-ci --idle-time=0 --no-config > "$log" 2>&1 &
          compositor_pid=$!
          trap 'kill "$compositor_pid" 2>/dev/null || true; wait "$compositor_pid" 2>/dev/null || true; rm -rf -- "$runtime_dir"' EXIT
          for attempt in {1..50}; do
            if [[ -S "$runtime_dir/sori-ci" ]]; then break; fi
            if ! kill -0 "$compositor_pid" 2>/dev/null; then cat "$log"; exit 1; fi
            sleep 0.2
          done
          if [[ ! -S "$runtime_dir/sori-ci" ]]; then cat "$log"; exit 1; fi
          export WAYLAND_DISPLAY=sori-ci
          python3 scripts/appimage-smoke.py build/appimage/Sori.AppDir --wayland
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.code == 'true' && (matrix.mode == 'package')
        with:
          name: sori-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          compression-level: 0
          path: |
            build/*.AppImage
            build/*.AppImage.sha256
            build/Sori-*-windows-*-setup-unsigned.exe
            build/Sori-*-windows-*-setup-unsigned.exe.sha256
            build/Sori-*-macos-*.dmg
            build/Sori-*-macos-*.dmg.sha256
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.code == 'true' && (failure())
        with:
          name: logs-${{ runner.os }}-${{ runner.arch }}-${{ matrix.mode }}
          path: build/Testing/Temporary/
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.code == 'true' && (failure() && runner.os == 'Windows')
        with:
          name: windows-installer-log-${{ matrix.mode }}
          if-no-files-found: ignore
          path: build/installer-check.log
  draft-release:
    name: Draft release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sori-*
          merge-multiple: true
          path: dist
      - name: Create or update draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/ci/draft-release.sh dist
