appId: com.sori.app
productName: Sori
executableName: Sori
icon: assets/icon.png
directories:
  output: release
files:
  - dist/**
  - electron/**
  - tests/smoke/**
  - package.json
  - native/**
asar: true
# Native addons cannot be loaded from inside app.asar.
asarUnpack:
  - native/**
npmRebuild: false
artifactName: Sori-${version}-${arch}.${ext}
# Offline Kiwi library and models live next to the app resources.
extraResources:
  - from: resources/kiwi
    to: kiwi
# FFmpeg is only used for probing/extracting subtitle tracks, not playback.
# Signing/notarization is intentionally not configured; release builds stay unsigned.
linux:
  target: AppImage
  category: Education
  syncDesktopName: true
  extraResources:
    - from: node_modules/ffmpeg-static/ffmpeg
      to: bin/ffmpeg
    - from: node_modules/ffprobe-static/bin/linux/x64/ffprobe
      to: bin/ffprobe
win:
  target:
    target: nsis
    arch:
      - x64
  extraResources:
    - from: node_modules/ffmpeg-static/ffmpeg.exe
      to: bin/ffmpeg.exe
    - from: node_modules/ffprobe-static/bin/win32/x64/ffprobe.exe
      to: bin/ffprobe.exe
nsis:
  perMachine: false
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  target:
    target: dmg
    arch:
      - arm64
  category: public.app-category.education
  extraResources:
    - from: node_modules/ffmpeg-static/ffmpeg
      to: bin/ffmpeg
    - from: node_modules/ffprobe-static/bin/darwin
      to: bin/ffprobe
