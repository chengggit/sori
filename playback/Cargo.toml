[package]
name = "sori-qt-playback"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
kiwi-rs = "=2026.10.17"
libmpv2-sys = "=4.0.1"
regex = "1"
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

qtbridge = { git = "https://github.com/qt/qtbridge-rust.git", rev = "cdd681c4efd0ccb9e670c407bf5b9a0e4962ecb3", features = ["serde_json"] }
