[package]
name = "sori-node"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.16.3", features = ["napi9", "async", "serde-json"] }
napi-derive = "3.7.2"
serde_json = "1"
sori-core = { path = "../sori-core" }

[build-dependencies]
napi-build = "2.7.0"
