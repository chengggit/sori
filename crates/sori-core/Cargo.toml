[package]
name = "sori-core"
version = "0.1.0"
edition = "2021"

[dependencies]
kiwi-rs = "=2026.10.17"
regex = "1"
roxmltree = "0.21"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
rusqlite = { version = "0.42", features = ["bundled"] }
scraper = { version = "0.24", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
