[package]
name = "sori-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[profile.release-with-debug]
inherits = "release"
debug = 2

[dependencies]
kiwi-rs = "=2026.10.17"
libmpv2-sys = "=4.0.1"
regex = "1"
roxmltree = "0.21"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
rusqlite = { version = "0.42", features = ["bundled"] }
scraper = { version = "0.24", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

qtbridge = { git = "https://github.com/qt/qtbridge-rust.git", rev = "cdd681c4efd0ccb9e670c407bf5b9a0e4962ecb3", features = ["serde_json"] }
